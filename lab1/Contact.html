<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>

    <h1 align="center">
        <font color="#8B0000"><u>Contact Us</u></font>
    </h1>
    
    <p align="center">
        <b>We are here to help!</b> Fill out the form below to send us a message.
    </p>
    
    <hr>
        
        <table align="center" border="0" cellpadding="10" width="60%">
            
            <tr>
                <td align="right">
                    <b><font size="4">Name:</font></b>
                </td>
                <td>
                    <input type="text" name="username" size="30" placeholder="Enter your full name">
                </td>
            </tr>

            <tr>
                <td align="right">
                    <b><font size="4">Email:</font></b>
                </td>
                <td>
                    <input type="email" name="useremail" size="30" placeholder="yourname@email.com">
                </td>
            </tr>

            <tr>
                <td align="right">
                    <b><font size="4">Phone:</font></b>
                </td>
                <td>
                    <input type="text" name="userphone" size="20">
                </td>
            </tr>

            <tr>
                <td align="right" valign="top">
                    <b><font size="4">Message:</font></b>
                </td>
                <td>
                    <textarea name="comment" rows="6" cols="32" style="font-family: Arial;"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <br>
                    <input type="submit" value="Send Message" style="font-weight: bold; padding: 5px 15px;">
                    &nbsp;&nbsp;
                    <input type="reset" value="Reset" style="padding: 5px 15px;">
                </td>
            </tr>

        </table>
    <br>
    <hr>
    
    <p align="center">
        <font size="2">
            <a href="About.html">About Us</a> | 
            <a href="Registration.html">Registration</a> | 
            Contact
        </font>
    </p>

</body>
</html>
