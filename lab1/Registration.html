<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body>

    <h1 align="center"><u>Registration Page</u></h1>
    <p align="center">Please fill out the form below to create your account.</p>
    <hr>

    
        
        <table align="center" cellpadding="10">
            
            <tr>
                <td><b>First Name:</b></td>
                <td><input type="text" name="firstname" placeholder="Enter first name"></td>
            </tr>

            <tr>
                <td><b>Last Name:</b></td>
                <td><input type="text" name="lastname" placeholder="Enter last name"></td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td><input type="password" name="userpass"></td>
            </tr>

            <tr>
                <td><b>Gender:</b></td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                </td>
            </tr>

            <tr>
                <td><b>City:</b></td>
                <td>
                    <select name="city">
                        <option value="cairo">Cairo</option>
                        <option value="Fayoum">Fayoum</option>
                        <option value="alex">Alexandria</option>
                        <option value="giza">Giza</option>
                        <option value="other">Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Hobbies:</b></td>
                <td>
                    <input type="checkbox" name="hobby" value="reading"> Reading
                    <input type="checkbox" name="hobby" value="sports"> Sports
                    <input type="checkbox" name="hobby" value="coding"> Coding
                </td>
            </tr>

            <tr>
                <td><b>Address:</b></td>
                <td>
                    <textarea name="address" rows="3" cols="22"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <br>
                    <input type="submit" value="Register Now">
                    <input type="reset" value="Clear Form">
                </td>
            </tr>

        </table>

</body>
</html>
